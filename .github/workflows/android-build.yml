name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms android,web --project-name inv_management

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos

      - name: Build installable Android APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Android App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: inv-management-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
